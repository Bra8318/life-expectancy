<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Expectancy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-xl sm:text-2xl font-bold mb-4 text-center">Life Expectancy Using Economic Indicators</h1>
        <p class="text-sm text-gray-600 text-center hidden" id="data">Your estimated life expectancy is:</p>
        <p id="result" class="text-1xl font-bold text-center mt-4 text-blue-500"></p>
        <div class="mt-6" id="form">
            Country:
            <input id="country" type="text" placeholder="Enter Country Name"
                class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Status:
            <select name="status" id="status"
                class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Choose Country Status</option>
                <option value="Developed">Developed</option>
                <option value="Developing">Developing</option>
            </select>
            GDP:
            <input id="gdp" type="number" placeholder="Enter GDP per capita"
                class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Income Composition of Resources:
            <input id="income" type="number" placeholder="Enter income composition of resources (0-1)"
                class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Total Expenditure:
            <input id="expenditure" type="number" placeholder="Enter total expenditure"
                class="w-full p-2 border rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="getLifeExpectancy()"
                class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 transition mt-6">
                Calculate Life Expectancy
            </button>
        </div>
        <div id="charts" class="mt-6 space-y-6 hidden">
            <canvas id="chart" class="w-full h-[300px]"></canvas>
            <canvas id="worldChart" class="w-full h-[300px]"></canvas>
            <canvas id="groupChart" class="w-full h-[300px]"></canvas>
            <canvas id="rankingChart" class="w-full h-[300px]"></canvas>
            <canvas id="mainChart" class="w-full h-[400px]"></canvas>
        </div>

    </div>


    <script>
        let mainChart = null;
        let groupChart = null;
        let rankingChart = null;

        function drawCharts(api) {

            const world = api.world_stat.mean;

            const prediction = api.prediction["Life expectancy"];

            const ctx1 = document.getElementById("mainChart").getContext("2d");

            if (mainChart) mainChart.destroy();

            mainChart = new Chart(ctx1, {
                type: "bar",
                data: {
                    labels: [
                        "GDP",
                        "Income Composition",
                        "Total Expenditure",
                        "Life Expectancy"
                    ],
                    datasets: [
                        {
                            label: "World Average",
                            data: [
                                world.GDP,
                                world["Income composition of resources"],
                                world["Total expenditure"],
                                world["Life expectancy"] || 70
                            ],
                            backgroundColor: "rgba(54, 162, 235, 0.5)"
                        },
                        {
                            label: "Your Input + Prediction",
                            data: [
                                api.world_stat.mean.GDP, // replace if you send user input separately
                                api.world_stat.mean["Income composition of resources"],
                                api.world_stat.mean["Total expenditure"],
                                prediction
                            ],
                            backgroundColor: "rgba(255, 99, 132, 0.5)"
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: "User vs World Comparison"
                        }
                    }
                }
            });

            // =========================
            // 2. GROUP COMPARISON CHART
            // =========================
            const group = api.group_stat;

            const ctx2 = document.getElementById("groupChart").getContext("2d");

            if (groupChart) groupChart.destroy();

            groupChart = new Chart(ctx2, {
                type: "bar",
                data: {
                    labels: Object.keys(group.GDP),
                    datasets: [
                        {
                            label: "GDP by Group",
                            data: Object.values(group.GDP),
                            backgroundColor: "rgba(75, 192, 192, 0.5)"
                        },
                        {
                            label: "Income Composition",
                            data: Object.values(group["Income composition of resources"]),
                            backgroundColor: "rgba(153, 102, 255, 0.5)"
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: "Developed vs Developing Comparison"
                        }
                    }
                }
            });

            // =========================
            // 3. RANKING CHART
            // =========================
            const ranking = api.ranking;

            const ctx3 = document.getElementById("rankingChart").getContext("2d");

            if (rankingChart) rankingChart.destroy();

            rankingChart = new Chart(ctx3, {
                type: "bar",
                data: {
                    labels: ranking.map(r => r.Country),
                    datasets: [{
                        label: "Life Expectancy",
                        data: ranking.map(r => r["Life expectancy"]),
                        backgroundColor: "rgba(255, 206, 86, 0.5)"
                    }]
                },
                options: {
                    indexAxis: "y",
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: "Top Countries Ranking"
                        }
                    }
                }
            });
        }
        let myChart = null;
        function title(str) {
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
        }
        function normalize(value, max) {
            return (value / max) * 100;
        }
        function drawChart(country, gdp, income, expenditure, prediction) {
            const ctx = document.getElementById('chart').getContext('2d');
            if (myChart) {
                myChart.destroy();
            }
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['GDP per capita', 'Income Composition of Resources', 'Total Expenditure', 'Predicted Life Expectancy'],
                    datasets: [{
                        label: title(country),
                        data: [normalize(gdp, 100000), income * 100, normalize(expenditure, 100), prediction],
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.2)',
                            'rgba(255, 206, 86, 0.2)',
                            'rgba(75, 192, 192, 0.2)',
                            'rgba(153, 102, 255, 0.2)'
                        ],
                        borderColor: [
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 206, 86, 1)',
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)'
                        ],
                        borderWidth: 1
                    }]
                }, options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        title: {
                            display: true,
                            text: `Economic Indicators and Predicted Life Expectancy - ${title(country)}`
                        }
                    },
                }
            })
        }

        let worldChart = null;

        function drawWorldChart(api) {

            const world = api.world_stat;

            const ctx = document.getElementById("worldChart").getContext("2d");

            if (worldChart) worldChart.destroy();

            worldChart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: [
                        "GDP",
                        "Income Composition",
                        "Total Expenditure"
                    ],
                    datasets: [
                        {
                            label: "Mean",
                            data: [
                                world.mean.GDP,
                                world.mean["Income composition of resources"],
                                world.mean["Total expenditure"]
                            ],
                            backgroundColor: "rgba(54, 162, 235, 0.6)"
                        },
                        {
                            label: "Min",
                            data: [
                                world.min.GDP,
                                world.min["Income composition of resources"],
                                world.min["Total expenditure"]
                            ],
                            backgroundColor: "rgba(255, 99, 132, 0.6)"
                        },
                        {
                            label: "Max",
                            data: [
                                world.max.GDP,
                                world.max["Income composition of resources"],
                                world.max["Total expenditure"]
                            ],
                            backgroundColor: "rgba(255, 206, 86, 0.6)"
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: "🌍 World Statistics Overview"
                        },
                        legend: {
                            position: "top"
                        }
                    }
                }
            });
        }

        async function getLifeExpectancy() {
            const country = document.getElementById('country').value;
            const status = document.getElementById('status').value;
            const gdp = document.getElementById('gdp').value;
            const income = document.getElementById('income').value;
            const expenditure = document.getElementById('expenditure').value;
            const result = document.getElementById('result');

            result.innerText = "";
            result.classList.add("text-red-500");

            function validateInput() {
                if (!country || !status || !gdp || !income || !expenditure) {
                    result.innerText = "Please fill in all the fields.";
                    return false;
                }
                return true;
            }

            function validateCountry() {
                if (!/^[a-zA-Z\s]+$/.test(country)) {
                    result.innerText = "Country name should only contain letters.";
                    return false;
                }
                return true;
            }
            function title(str) {
                return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
            }

            function incomeValidation() {
                if (income <= 0 || income >= 1) {
                    result.innerText = "Income composition of resources must be between 0 and 1.";
                    return false;
                }
                return true;
            }

            function gdpValidation() {
                if (gdp <= 0) {
                    result.innerText = "GDP per capita must be a positive number.";
                    return false;
                }
                return true;
            }

            function expenditureValidation() {
                if (expenditure <= 0) {
                    result.innerText = "Total expenditure must be a positive number.";
                    return false;
                }
                return true;
            }
            if (
                !validateInput() ||
                !validateCountry() ||
                !incomeValidation() ||
                !gdpValidation() ||
                !expenditureValidation()
            ) {
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/economic', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        Country: country,
                        Status: status,
                        GDP: gdp,
                        Income_Composition_of_Resources: income,
                        Total_Expenditure: expenditure
                    })
                });

                const data = await response.json();
                const dataText = document.getElementById('data');
                const formdata = document.getElementById('form');
                const prediction = data.prediction.prediction['Life expectancy'];
                const charts = document.getElementById('charts');

                if (data.status === 'success') {
                    result.innerText = prediction.toFixed(2);
                    result.classList.remove("text-red-500", "text-blue-500");
                    result.classList.add("text-green-500");
                    dataText.classList.remove('hidden');
                    formdata.classList.add('hidden');
                    charts.classList.remove('hidden');
                    drawChart(country, gdp, income, expenditure, prediction);
                    drawWorldChart(data.prediction);
                    drawCharts(data.prediction);
                } else {
                    result.innerText = data.message;
                    dataText.classList.remove('hidden');
                }

            }
            catch (error) {
                result.innerText = "Error connecting to server.";
                console.error(error);
            }
        }
    </script>
</body>

</html>
